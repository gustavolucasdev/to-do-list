<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="todo-app">
            <header class="header">
                <h1><i class="fas fa-tasks"></i> Minha Lista de Tarefas</h1>
                <p class="subtitle">Organize suas atividades diárias</p>
            </header>

            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="taskInput" placeholder="Adicione uma nova tarefa..." maxlength="100">
                    <button id="addBtn" class="add-btn">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalTasks">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="completedTasks">0</span>
                    <span class="stat-label">Concluídas</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="pendingTasks">0</span>
                    <span class="stat-label">Pendentes</span>
                </div>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i> Todas
                </button>
                <button class="filter-btn" data-filter="pending">
                    <i class="fas fa-clock"></i> Pendentes
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check"></i> Concluídas
                </button>
            </div>

            <div class="tasks-container">
                <ul id="tasksList" class="tasks-list"></ul>
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>Nenhuma tarefa ainda</h3>
                    <p>Adicione sua primeira tarefa acima</p>
                </div>
            </div>

            <div class="actions">
                <button id="clearCompleted" class="action-btn">
                    <i class="fas fa-trash"></i> Limpar Concluídas
                </button>
                <button id="clearAll" class="action-btn danger">
                    <i class="fas fa-trash-alt"></i> Limpar Todas
                </button>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
